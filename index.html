<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Warzone TD</title>
  <meta name="theme-color" content="#1c1f17" />
  <meta name="description" content="A mazing tower defense: 34 towers, 9 enemy types, top-down and isometric, co-op, map editor." />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./icon.svg" />
  <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="app">
    <header id="topbar">
      <div class="brand">WARZONE<span>TD</span></div>
      <div class="stat"><label>Money</label><b id="money">0</b></div>
      <div class="stat"><label>Lives</label><b id="lives">0</b></div>
      <div class="stat"><label>Wave</label><b id="wave">0</b></div>
      <div class="stat"><label>Kills</label><b id="kills">0</b></div>
      <div class="spacer"></div>
      <button id="next" class="primary" title="N">Start wave 1</button>
      <div class="seg" id="speed">
        <button data-speed="0" title="Space">❚❚</button>
        <button data-speed="1" class="on">1×</button>
        <button data-speed="2">2×</button>
        <button data-speed="4">4×</button>
      </div>
      <button id="undo" title="Undo the last build (Ctrl+Z, full refund for 5 s)">Undo</button>
      <button id="camera" title="Switch camera (V)">View: Top</button>
      <button id="gear" title="Settings">⚙</button>
      <button id="menu" title="Main menu">Menu</button>
    </header>
    <main>
      <div id="stage">
        <div id="banner"></div>
        <div id="report"></div>
        <div id="wavebox"></div>
        <div id="tactical"></div>
      </div>
      <aside id="side">
        <div id="build"></div>
        <div id="info"></div>
      </aside>
    </main>
    <footer id="perf"></footer>
  </div>
  <div id="overlay" class="hidden"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
